name: Deploy TOGOSERVE to GitHub Pages (Static Mirror Only)

# NOTE: GitHub Pages only hosts static client files (dist/).
# Full-stack backend APIs (/api/auth/*, /api/ai/*) require the production Express container (Dockerfile).

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required source files
        run: npm run verify:files

      - name: Build TOGOSERVE
        run: npm run build

      # GitHub Pages has no server-side SPA rewrite support. Serve the same
      # Vite app shell for direct visits and browser refreshes on nested routes.
      - name: Enable client-side route refresh fallback
        run: |
          test -f dist/index.html
          cp dist/index.html dist/404.html
          test -f dist/404.html

      - name: Verify production build
        run: |
          test -f dist/index.html
          test -f dist/404.html
          echo "TOGOSERVE production build and SPA fallback verified."
          ls -la dist

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy TOGOSERVE
        id: deployment
        uses: actions/deploy-pages@v4
